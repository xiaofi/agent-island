[package]
name = "agent-island"
version = "0.1.4"
description = "A lightweight floating desktop panel for local coding agents"
authors = ["Agent Island"]
edition = "2021"

[lib]
name = "agent_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.30"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSResponder", "NSWindow"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
dispatch2 = { path = "vendor/dispatch2" }
